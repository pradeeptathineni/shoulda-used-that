[project]
site_name = "ShouldaUsedThat"
site_url = "https://pradeeptathineni.github.io/shoulda-used-that/"
site_description = "See what to reuse, what to skip, and what is genuinely left to build."
site_author = "Pradeep Tathineni"
copyright = "ShouldaUsedThat · Apache-2.0 · Reuse what fits; build what remains"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/pradeeptathineni/shoulda-used-that"
repo_name = "pradeeptathineni/shoulda-used-that"
edit_uri = "edit/main/docs"
extra_css = ["curation/assets/catalog.css"]
nav = [
  { "Home" = "index.md" },
  { "Decisions" = "curation/index.md" },
  { "CLI" = "getting-started.md" },
  { "How it works" = "architecture/product-contract.md" },
]

[project.theme]
variant = "modern"
language = "en"
font = false
custom_dir = "site-overrides"
features = [
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use light theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "green"
toggle.icon = "lucide/sun"
toggle.name = "Use dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "green"
toggle.icon = "lucide/moon"
toggle.name = "Use system theme"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}

[project.plugins.search]

[project.plugins.tags]
