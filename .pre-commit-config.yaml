repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: schema-and-repository-contracts
        name: Generated schemas and repository contracts
        entry: bash -c 'uv run python scripts/generate_schemas.py --check && uv run python scripts/validate_repository.py'
        language: system
        pass_filenames: false
      - id: full-gate
        name: Full local gate
        entry: ./scripts/check.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
