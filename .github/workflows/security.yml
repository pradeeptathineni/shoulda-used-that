name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow correctness and security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.15
          enable-cache: false
      - name: Install Python and locked tools
        run: |
          uv python install 3.12
          uv sync --all-groups --frozen --python 3.12
      - name: Run actionlint at its reviewed commit
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run zizmor --pedantic .github/workflows

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # CodeQL SARIF publication to code scanning.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  docs:
    name: Spelling and links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
      - name: Check public writing
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.21.0
          files: >-
            ["AGENTS.md","CHANGELOG.md","CONTRIBUTING.md","README.md","SECURITY.md","schemas/README.md",
            "docs/architecture/curation-v0.2.md","docs/architecture/dogfood-reuse-audit.md",
            "docs/architecture/implementation-brief.md","docs/architecture/product-contract.md",
            "docs/architecture/public-writing.md","docs/decisions/README.md",
            "docs/development/architecture-review-2026-09-17.md",
            "docs/development/catalog-scale-validation.md","docs/development/context-receipt.md",
            "docs/development/public-surface-review-v0.3.0.md","docs/development/public-value-review-v0.4.0.md",
            "docs/development/review-v0.1.0.md",
            "docs/development/review-v0.2.0.md","docs/development/sbom-comparison.md",
            "docs/getting-started.md","docs/index.md","docs/operations/github-curation.md",
            "docs/operations/live-projection.md","docs/operations/scheduling.md",
            "docs/releases/v0.1.0.md","docs/releases/v0.2.0.md","docs/releases/v0.3.0.md",
            "docs/releases/v0.4.0.md",
            "docs/curation/index.md","docs/curation/sources.md","docs/curation/tags.md",
            "docs/curation/briefs/curated-oss-evidence-publishing.md",
            "docs/curation/briefs/deterministic-python-research-core.md",
            "docs/curation/briefs/local-first-prior-art-coordination.md",
            "docs/curation/briefs/reproducible-python-quality-gate.md",
            "docs/curation/briefs/static-technical-docs-review.md",
            "docs/curation/evidence/addyosmani--agent-skills.md",
            "docs/curation/evidence/amintacccp--githubstarsmanager.md",
            "docs/curation/evidence/astral-sh--uv.md",
            "docs/curation/evidence/best-of-lists--best-of-generator.md",
            "docs/curation/evidence/best-of-lists--best-of.md",
            "docs/curation/evidence/boffti--stardash.md",
            "docs/curation/evidence/ejacobhayes--parsecio.md",
            "docs/curation/evidence/github--codeql-action.md",
            "docs/curation/evidence/jmespath--jmespath.py.md",
            "docs/curation/evidence/pallets--click.md",
            "docs/curation/evidence/pradeeptathineni--shoulda-used-that.md",
            "docs/curation/evidence/pydantic--pydantic.md",
            "docs/curation/evidence/pytest-dev--pytest.md",
            "docs/curation/evidence/shubhamsaboo--awesome-llm-apps.md",
            "docs/curation/evidence/trailofbits--rfc8785.py.md",
            "docs/curation/evidence/vale-cli--vale.md",
            "docs/curation/evidence/zensical--zensical.md"]
          sync: false
          filter_mode: nofilter
          fail_level: warning
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3
            --host-concurrency 2 --host-request-interval 250ms
            --exclude '^https://api\.github\.com/'
            --exclude '^https://pradeeptathineni\.github\.io/shoulda-used-that/'
            README.md docs/**/*.md
          fail: true
