[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "shoulda-used-that"
version = "0.3.0"
description = "Find existing open source before building from scratch, record why it fits, and revisit the choice when evidence changes."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pradeep Tathineni" }]
keywords = ["open-source", "prior-art", "decision-records", "github", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.5.0,<9",
  "jmespath==1.1.0",
  "platformdirs>=4.11.9,<5",
  "pydantic>=2.13.5,<3",
  "PyYAML>=6.0.3,<7",
  "rfc8785==0.1.4",
  "rich>=15.0.0,<16",
]

[project.urls]
Homepage = "https://github.com/pradeeptathineni/shoulda-used-that"
Repository = "https://github.com/pradeeptathineni/shoulda-used-that"
Issues = "https://github.com/pradeeptathineni/shoulda-used-that/issues"
Changelog = "https://github.com/pradeeptathineni/shoulda-used-that/blob/main/CHANGELOG.md"

[project.scripts]
shoulda = "shoulda_used_that.cli:main"

[dependency-groups]
dev = [
  "build==1.6.1",
  "coverage==7.16.1",
  "hypothesis==6.168.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "ruff==0.16.8",
  "types-PyYAML==6.0.12.20260906",
  "zensical==0.0.62",
  "zizmor==1.30.1",
]
release = ["cyclonedx-bom==7.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/shoulda_used_that"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["shoulda_used_that"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "C90", "DTZ", "PT", "RUF", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"src/shoulda_used_that/public_export.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["shoulda_used_that"]

[[tool.mypy.overrides]]
module = "jmespath.*"
ignore_missing_imports = true
